 document.querySelectorAll('#pre button').forEach(b=>b.classList.toggle('on',b.textContent==k));try{localStorage.pre=k}catch{}}

try{cur=localStorage.pre||'Flat'}catch{};setPreset(cur);
// visualizer
const cv=$('#viz'),c2=cv.getContext('2d');let vcol='#ff8800',vst='bars';

 if(vst=='wave'){const a=new Uint8Array(an.fftSize);an.getByteTimeDomainData(a);c2.lineWidth=2;c2.beginPath();a.forEach((x,i)=>{const X=i/a.length*W,Y=x/255*H;i?c2.lineTo(X,Y):c2.moveTo(X,Y)});c2.stroke();return}

const DB=new Promise((res,rej)=>{const r=indexedDB.open('omp',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});if(!d.objectStoreNames.contains('lib'))d.createObjectStore('lib',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
